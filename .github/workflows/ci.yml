name: Java CI - Multithread Lab

on:
  push:
    branches: [ main, dev, feature/* ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Download JUnit Console Standalone
        run: |
          mkdir -p lib
          wget -q https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar -O lib/junit-platform-console-standalone.jar
          echo "✅ JUnit Console Standalone downloaded"

      - name: Show directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Looking for src directory:"
          find . -type d -name "src" 2>/dev/null || echo "src not found"

      - name: Find project root
        run: |
          SRC_PATH=$(find . -type d -name "src" | head -1)
          if [ -n "$SRC_PATH" ]; then
            PROJECT_ROOT=$(dirname "$SRC_PATH")
            echo "Found project root: $PROJECT_ROOT"
            echo "PROJECT_ROOT=$PROJECT_ROOT" >> $GITHUB_ENV
          else
            echo "❌ src directory not found!"
            exit 1
          fi

      - name: Compile Project
        run: |
          cd $PROJECT_ROOT
          echo "Now in: $(pwd)"
          mkdir -p out
          
          JAVA_FILES=$(find src -name "*.java")
          FILE_COUNT=$(echo "$JAVA_FILES" | wc -l)
          echo "Found $FILE_COUNT Java files"
          
          javac -d out -cp "../../lib/*" $JAVA_FILES
          
          if [ $? -eq 0 ]; then
            echo "✅ Compilation successful!"
          else
            echo "❌ Compilation failed!"
            exit 1
          fi

      - name: List compiled classes
        run: |
          cd $PROJECT_ROOT
          echo "Compiled classes:"
          find out -type f -name "*.class" | head -20

      - name: Run Tests (if any)
        run: |
          cd $PROJECT_ROOT
          TEST_CLASSES=$(find out -name "*Test.class" | wc -l)
          
          if [ "$TEST_CLASSES" -gt 0 ]; then
            echo "Found $TEST_CLASSES test classes"
            mkdir -p test-results
          
            java -jar ../../lib/junit-platform-console-standalone.jar \
              --class-path out \
              --scan-class-path \
              --include-classname='.*Test' \
              --reports-dir=test-results \
              --details=tree
          
            if [ $? -eq 0 ]; then
              echo "✅ All tests passed!"
            else
              echo "❌ Some tests failed!"
              exit 1
            fi
          else
            echo "ℹ️ No tests found - skipping test execution"
          fi

      - name: Run Program Demo
        run: |
          cd $PROJECT_ROOT
          echo ""
          echo "========================================="
          echo "🚀 ЗАПУСК ПРОГРАММЫ (демо на 3 секунды)"
          echo "========================================="
          
          # Запускаем программу в фоне
          java -cp out multithread.Main &
          PID=$!
          
          # Даем поработать 3 секунды
          sleep 3
          
          # Останавливаем программу
          kill $PID 2>/dev/null || true
          
          echo ""
          echo "========================================="
          echo "✅ Программа успешно запущена и работает"
          echo "========================================="

      - name: Upload Test Results (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ env.PROJECT_ROOT }}/test-results/