name: Java CI - Compile & Test

on:
  push:
    branches: [ dev, main, feature/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Download JUnit Console Standalone
        run: |
          mkdir -p lib
          # Скачиваем standalone версию (содержит всё необходимое)
          wget -q https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar -O lib/junit-platform-console-standalone.jar
          echo "✅ JUnit Console Standalone downloaded"
          ls -la lib/

      - name: Show directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Looking for RBAC directory:"
          find . -type d -name "RBAC" | head -5

      - name: Compile Project
        run: |
          # Переходим в директорию RBAC (там где src)
          cd RBAC
          echo "Now in: $(pwd)"
          echo "Contents of RBAC directory:"
          ls -la
          
          # Создаем директорию для скомпилированных файлов
          mkdir -p out
          
          echo "Compiling Java files from src..."
          # Компилируем все .java файлы из src (включая тесты)
          find src -name "*.java" | xargs javac -d out -cp "../lib/*"
          
          if [ $? -eq 0 ]; then
            echo "✅ Compilation successful!"
            echo "Compiled classes:"
            find out -type f -name "*.class" | head -10
          else
            echo "❌ Compilation failed!"
            exit 1
          fi

      - name: Run Tests
        run: |
          cd RBAC
          echo "Running tests from: $(pwd)"
          
          # Создаем директорию для результатов тестов
          mkdir -p test-results
          
          # Запускаем тесты через standalone JAR
          # Важно: classpath указывает на скомпилированные классы в out
          java -jar ../lib/junit-platform-console-standalone.jar \
            --class-path out \
            --scan-class-path \
            --include-classname='.*Test' \
            --reports-dir=test-results \
            --details=tree
          
          # Проверяем результат
          if [ $? -eq 0 ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed!"
            exit 1
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: RBAC/test-results/
