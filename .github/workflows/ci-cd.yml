name: Java CI - Compile & Test

on:
  push:
    branches: [ dev, main, feature/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Download JUnit 5 Dependencies
        run: |
          mkdir -p lib
          echo "Скачиваем библиотеки..."
          wget https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-api/5.10.2/junit-jupiter-api-5.10.2.jar -O lib/junit-jupiter-api.jar
          wget https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-engine/5.10.2/junit-jupiter-engine-5.10.2.jar -O lib/junit-jupiter-engine.jar
          wget https://repo1.maven.org/maven2/org/junit/platform/junit-platform-commons/1.10.2/junit-platform-commons-1.10.2.jar -O lib/junit-platform-commons.jar
          wget https://repo1.maven.org/maven2/org/opentest4j/opentest4j/1.3.0/opentest4j-1.3.0.jar -O lib/opentest4j.jar
          wget https://repo1.maven.org/maven2/org/apiguardian/apiguardian-api/1.1.2/apiguardian-api-1.1.2.jar -O lib/apiguardian-api.jar
          wget https://repo1.maven.org/maven2/org/junit/platform/junit-platform-launcher/1.10.2/junit-platform-launcher-1.10.2.jar -O lib/junit-platform-launcher.jar
          
          echo "Файлы скачаны:"
          ls -l lib/

      - name: Compile Project
        run: |
          cd RBAC
          mkdir -p out
          
          # Формируем classpath из всех файлов в папке lib (которая в корне)
          # Используем явный цикл, чтобы избежать проблем со звездочкой
          CP="../lib/junit-jupiter-api.jar:../lib/junit-jupiter-engine.jar:../lib/junit-platform-commons.jar:../lib/opentest4j.jar:../lib/apiguardian-api.jar:../lib/junit-platform-launcher.jar"
          
          echo "Компилируем файлы..."
          find src -name "*.java" > sources.txt
          javac -d out -cp "$CP" @sources.txt

      - name: Run Unit Tests
        run: |
          cd RBAC
          
          # Тот же classpath
          CP="../lib/junit-jupiter-api.jar:../lib/junit-jupiter-engine.jar:../lib/junit-platform-commons.jar:../lib/opentest4j.jar:../lib/apiguardian-api.jar:../lib/junit-platform-launcher.jar"
          
          echo "Запускаем тесты..."
          java -cp "$CP:out" org.junit.platform.console.ConsoleLauncher --select-package managers --details tree
