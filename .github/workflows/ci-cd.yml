name: Java CI - Compile

on:
  push:
    branches: [ dev, main, feature/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Download JUnit 5 Dependencies (for compilation only)
        run: |
          mkdir -p lib
          echo "Downloading JUnit 5 libraries for compilation..."
          # Скачиваем только необходимые для компиляции JARы
          wget -q https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-api/5.10.2/junit-jupiter-api-5.10.2.jar -O lib/junit-jupiter-api.jar
          wget -q https://repo1.maven.org/maven2/org/junit/platform/junit-platform-commons/1.10.2/junit-platform-commons-1.10.2.jar -O lib/junit-platform-commons.jar
          wget -q https://repo1.maven.org/maven2/org/opentest4j/opentest4j/1.3.0/opentest4j-1.3.0.jar -O lib/opentest4j.jar
          wget -q https://repo1.maven.org/maven2/org/apiguardian/apiguardian-api/1.1.2/apiguardian-api-1.1.2.jar -O lib/apiguardian-api.jar
          
          echo "Files downloaded:"
          ls -la lib/

      - name: Compile Project
        run: |
          # Переходим в директорию RBAC
          cd RBAC
          
          # Создаем директорию для скомпилированных файлов
          mkdir -p out
          
          # Формируем classpath с библиотеками (относительный путь)
          export CLASSPATH="../lib/*:out"
          
          echo "Current directory: $(pwd)"
          echo "Compiling Java files..."
          
          # Компилируем все .java файлы из src
          find src -name "*.java" -print | xargs javac -d out -cp "$CLASSPATH"
          
          # Проверяем результат компиляции
          if [ $? -eq 0 ]; then
            echo "✅ Compilation successful!"
            echo "Compiled classes:"
            find out -type f -name "*.class" | head -10
          else
            echo "❌ Compilation failed!"
            exit 1
          fi

      - name: Upload compilation artifacts (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: RBAC/out/
