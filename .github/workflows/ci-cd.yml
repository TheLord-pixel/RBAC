name: Java CI - Compile & Test

on:
  push:
    branches: [ dev, main, feature/* ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Download JUnit Console Standalone
        run: |
          mkdir -p lib
          wget -q https://repo1.maven.org/maven2/org/junit/platform/junit-platform-console-standalone/1.10.2/junit-platform-console-standalone-1.10.2.jar -O lib/junit-platform-console-standalone.jar
          echo "✅ JUnit Console Standalone downloaded"
          ls -la lib/

      - name: Show directory structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          echo "Looking for source files:"
          find . -name "*.java" | head -20

      - name: Compile Project
        run: |
          cd RBAC
          echo "Now in: $(pwd)"
          echo "Contents of RBAC directory:"
          ls -la
          
          # Создаем директорию для скомпилированных файлов
          mkdir -p out
          
          echo "Compiling all Java files from src..."
          # Находим все .java файлы и компилируем
          JAVA_FILES=$(find src -name "*.java")
          echo "Found $(echo "$JAVA_FILES" | wc -l) Java files"
          
          javac -d out -cp "../lib/*" $JAVA_FILES
          
          if [ $? -eq 0 ]; then
            echo "✅ Compilation successful!"
            echo "Compiled classes:"
            find out -type f -name "*.class" | wc -l | xargs echo "Number of class files:"
          else
            echo "❌ Compilation failed!"
            exit 1
          fi

      - name: List compiled test classes
        run: |
          cd RBAC
          echo "Test classes compiled:"
          find out -name "*Test.class" | sed 's/out\///' | sed 's/\.class//' | sed 's/\//./g'

      - name: Run Tests
        run: |
          cd RBAC
          echo "Running tests from: $(pwd)"
          
          # Создаем директорию для результатов тестов
          mkdir -p test-results
          
          # Запускаем тесты через standalone JAR
          java -jar ../lib/junit-platform-console-standalone.jar \
            --class-path out \
            --scan-class-path \
            --include-classname='.*Test' \
            --reports-dir=test-results \
            --details=tree
          
          TEST_RESULT=$?
          
          # Показываем краткий отчет
          echo ""
          echo "📊 Test Results Summary:"
          if [ -f test-results/TEST-junit-jupiter.xml ]; then
            echo "Test results saved to test-results/"
          fi
          
          if [ $TEST_RESULT -eq 0 ]; then
            echo "✅ All tests passed!"
          else
            echo "❌ Some tests failed!"
            exit $TEST_RESULT
          fi

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: RBAC/test-results/

      - name: Upload Compiled Classes (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiled-classes
          path: RBAC/out/
