name: Java CI

on:
  push:
    branches: [ "feature/managers", "dev", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: '20'
          distribution: 'temurin'

      - name: Download JUnit
        run: |
          mkdir -p lib
          wget -q https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-api/5.10.2/junit-jupiter-api-5.10.2.jar -O lib/junit-api.jar
          wget -q https://repo1.maven.org/maven2/org/junit/jupiter/junit-jupiter-engine/5.10.2/junit-jupiter-engine-5.10.2.jar -O lib/junit-engine.jar
          wget -q https://repo1.maven.org/maven2/org/junit/platform/junit-platform-commons/1.10.2/junit-platform-commons-1.10.2.jar -O lib/platform-commons.jar
          wget -q https://repo1.maven.org/maven2/org/opentest4j/opentest4j/1.3.0/opentest4j-1.3.0.jar -O lib/opentest4j.jar
          wget -q https://repo1.maven.org/maven2/org/apiguardian/apiguardian-api/1.1.2/apiguardian-api-1.1.2.jar -O lib/apiguardian.jar
          wget -q https://repo1.maven.org/maven2/org/junit/platform/junit-platform-launcher/1.10.2/junit-platform-launcher-1.10.2.jar -O lib/launcher.jar

      - name: Compile
        run: |
          mkdir -p out
          javac -d out -cp "lib/*" src/models/*.java src/filters/*.java src/managers/*.java

      - name: Test
        run: |
          javac -d out -cp "lib/*:out" src/managers/ManagersTest.java
          java -cp "lib/*:out" org.junit.platform.console.ConsoleLauncher --select-package managers --details tree